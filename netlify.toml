[[redirects]]
  from   = "/api/send"
  to     = "/.netlify/functions/send"
  status = 200
  force  = true

# ---------------------------------------------------------------------------
# HYBRID/ISR DRAFT TEST CONTEXT — inert by default.
#
# This block applies ONLY when a build explicitly asks for it with
# `netlify build --context hybrid-draft`. It is NOT one of Netlify's built-in
# context names (production / deploy-preview / branch-deploy), so no automatic
# build — including production — will ever select it.
#
# It exists because `netlify build` otherwise runs the site's UI-configured
# command (`npm run generate`), which produces a fully static site. The hybrid
# build needs `npm run build` plus the SSR preset.
#
# Verified locally against NITRO_PRESET=netlify:
#   * publish dir is `dist` (NOT `.output/public` — that is never created)
#   * the server function is emitted to .netlify/functions-internal/server
#   * routing is declared inline on the function (path:"/*", preferStatic:true),
#     so static pages still serve from the CDN and only unbuilt paths invoke it.
# ---------------------------------------------------------------------------
[context.hybrid-draft]
  base    = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[context.hybrid-draft.environment]
  NITRO_PRESET = "netlify"
  HYBRID_NEWS  = "true"

  # Netlify injects environment variables per CONTEXT. 'hybrid-draft' is not one
  # of the built-in context names, so the site's configured variables are NOT
  # injected for it — run 33485069253 failed with "[@nuxtjs/sanity] No Sanity
  # project found" and a 500 on "/" for exactly this reason.
  #
  # Every variable below is public: they live in runtimeConfig.public (see
  # frontend/nuxt.config.ts) and are therefore already served in the client
  # bundle on nadadebs.com. No secret is introduced here.
  #
  # Deliberately absent: RESEND_API_KEY, KLAVIYO_*, MAILCHIMP_*. Those are real
  # secrets, are read only by the Netlify Functions at runtime, and are not
  # needed to build.
  APP_ENV                         = "production"
  SANITY_PROJECT_ID               = "vo2kiy27"
  SANITY_PROJECT_DATASET          = "production"
  SANITY_API_VERSION              = "2024-02-01"
  NUXT_PUBLIC_SITE_URL            = "https://nadadebs.com"
  # app.vue awaits initShopify() before ANY route renders, so an empty domain or
  # token throws and every page 500s. Required even though News is not commerce.
  SHOPIFY_STORE_DOMAIN            = "nadadebs.myshopify.com"
  SHOPIFY_STOREFRONT_ACCESS_TOKEN = "93206ed9d5b2b23a2722a36a67ca4980"
