name: Deploy Netlify (DRAFT — production context)

# Manual-only. DRAFT deploy: builds with the production environment-variable
# context but never publishes over nadadebs.com. There is deliberately no
# `--prod` anywhere in this workflow.
#
# This revision makes the GitHub runner produce a NETLIFY-NATIVE Nitro build,
# instead of copying .output/public into dist as a workaround.
#
# Background (proven by run 33059359770):
#   * On the runner, Nitro auto-detected preset `static` and wrote to
#     frontend/.output/public. Only 1 file was hashed from frontend/dist,
#     so the draft served 404.
#   * `netlify build` does NOT set NETLIFY=true itself — that is why the
#     hosted build and the runner build diverged.
#
# Mechanism: nitropack 2.13.0 detects the Netlify provider via std-env 3.10.0,
# which keys off the NETLIFY environment variable. Setting NETLIFY=true
# reproduces Netlify's hosted build environment exactly and lets Nitro resolve
# the same preset production resolves. NITRO_PRESET is also supported by this
# version, but forcing `netlify` would override the static resolution that
# `nuxt generate` produces on Netlify, making the build LESS faithful, so it is
# deliberately not used. netlify-edge is explicitly rejected by the guard below.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nada-debs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Netlify-native build, verify, then draft-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Provides NETLIFY_AUTH_TOKEN (secret) and NETLIFY_SITE_ID (variable).
    environment: nada-debs-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Netlify site ID is configured
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not set in the nada-debs-prod environment."
            exit 1
          fi
          echo "NETLIFY_SITE_ID is present."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@27.4.0

      # ---------------------------------------------------------------------
      # BUILD ONLY, with NETLIFY=true so Nitro selects the Netlify provider
      # exactly as it does in Netlify's hosted build.
      # ---------------------------------------------------------------------
      - name: Netlify build (production context, Netlify-native preset)
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
          # Reproduces Netlify's hosted build environment for Nitro's provider
          # auto-detection (std-env). This is what makes the build produce the
          # native `dist` artifact instead of `.output/public`.
          NETLIFY: 'true'
        run: |
          netlify build --context production 2>&1 | tee "$RUNNER_TEMP/build.log"

      # ---------------------------------------------------------------------
      # DIAGNOSTICS. No environment variable VALUES are printed.
      # ---------------------------------------------------------------------
      - name: Diagnose build output
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"

          echo "=============================================================="
          echo "Resolved Nitro preset"
          echo "=============================================================="
          if [ -f "$LOG" ]; then
            # Strip ANSI colour codes before matching.
            sed 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -iE "Nitro preset:" || echo "(no 'Nitro preset:' line found)"
          else
            echo "(build log missing)"
          fi

          echo
          echo "=== Environment markers that drive Nitro provider detection ==="
          echo "NETLIFY = '${NETLIFY:-<unset>}'"
          echo "CONTEXT = '${CONTEXT:-<unset>}'"
          echo "node    = $(node -v)"

          echo
          echo "=== nitro.json (wherever the preset placed it) ==="
          for candidate in \
            frontend/.output/nitro.json \
            frontend/.netlify/functions-internal/nitro.json \
            frontend/dist/nitro.json; do
            if [ -f "$candidate" ]; then
              echo "--- $candidate ---"
              cat "$candidate"
              echo
            fi
          done
          find frontend -maxdepth 4 -name nitro.json -not -path "*/node_modules/*" 2>/dev/null || true

          echo
          echo "=============================================================="
          echo "frontend/dist  (the configured publish directory)"
          echo "=============================================================="
          ls -ld frontend/dist 2>/dev/null || echo "frontend/dist DOES NOT EXIST"
          if [ -L frontend/dist ]; then
            echo "!! frontend/dist IS A SYMLINK -> $(readlink -f frontend/dist)"
          else
            echo "frontend/dist is NOT a symlink"
          fi
          echo "--- top level ---"
          ls -la frontend/dist 2>/dev/null || true
          echo "--- regular file count ---"
          echo "count: $(find frontend/dist -type f 2>/dev/null | wc -l)"
          echo "--- sample of files (first 60, maxdepth 3) ---"
          find frontend/dist -maxdepth 3 -type f 2>/dev/null | sort | head -60 || true

          echo
          echo "--- expected site entrypoints ---"
          for f in index.html 200.html 404.html; do
            if [ -f "frontend/dist/$f" ]; then echo "  present: $f"; else echo "  absent : $f"; fi
          done
          if [ -d frontend/dist/_nuxt ]; then
            echo "  present: _nuxt/ ($(find frontend/dist/_nuxt -type f | wc -l) files)"
          else
            echo "  absent : _nuxt/"
          fi

          echo
          echo "--- Netlify-specific generated artifacts ---"
          for f in _redirects _headers; do
            if [ -f "frontend/dist/$f" ]; then
              echo "  present: $f"
              echo "  ----- $f (first 40 lines) -----"
              head -40 "frontend/dist/$f"
            else
              echo "  absent : $f"
            fi
          done

          echo
          echo "=============================================================="
          echo "frontend/.output/public  (reported only — NOT the deploy source)"
          echo "=============================================================="
          if [ -e frontend/.output/public ]; then
            ls -ld frontend/.output/public
            echo "regular file count: $(find frontend/.output/public -type f 2>/dev/null | wc -l)"
            if [ -f frontend/.output/public/index.html ]; then
              echo "frontend/.output/public/index.html EXISTS"
            else
              echo "frontend/.output/public/index.html MISSING"
            fi
          else
            echo "frontend/.output/public DOES NOT EXIST"
          fi

          echo
          echo "=== .netlify directory produced by the build, if any ==="
          ls -la frontend/.netlify 2>/dev/null || echo "(no frontend/.netlify)"

      # ---------------------------------------------------------------------
      # GUARD. Fails BEFORE any deploy. There is deliberately no fallback copy
      # from .output/public — this test must prove the Netlify preset itself
      # produces the native artifact.
      # ---------------------------------------------------------------------
      - name: Verify Netlify-native artifact before deploying
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          FAIL=0

          PRESET=""
          if [ -f "$LOG" ]; then
            PRESET="$(sed 's/\x1b\[[0-9;]*m//g' "$LOG" \
              | grep -oiE "Nitro preset:[[:space:]]*[A-Za-z0-9._-]+" \
              | head -n 1 \
              | sed -E 's/.*:[[:space:]]*//')"
          fi
          echo "Detected Nitro preset: '${PRESET:-<unknown>}'"

          case "$PRESET" in
            static)
              echo "::error::Nitro resolved preset 'static'. NETLIFY=true did not switch the provider, so the build is NOT Netlify-native."
              FAIL=1
              ;;
            netlify-edge)
              echo "::error::Nitro resolved preset 'netlify-edge'. Edge Functions are explicitly not wanted for this project."
              FAIL=1
              ;;
            netlify*)
              echo "OK: Netlify-native preset '$PRESET' (not edge)."
              ;;
            "")
              echo "::warning::Could not determine the Nitro preset from the build log. Falling back to artifact checks only."
              ;;
            *)
              echo "::error::Unexpected Nitro preset '$PRESET' — expected a netlify* preset."
              FAIL=1
              ;;
          esac

          # Artifact checks against the configured publish directory.
          if [ ! -d frontend/dist ]; then
            echo "::error::frontend/dist does not exist after the Netlify build."
            FAIL=1
          elif [ -L frontend/dist ]; then
            echo "::error::frontend/dist is a symlink, not a native directory. The deploy walker would upload nothing."
            FAIL=1
          elif [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing after the Netlify build."
            FAIL=1
          else
            COUNT="$(find frontend/dist -type f | wc -l)"
            echo "frontend/dist regular file count: $COUNT"
            if [ "$COUNT" -lt 10 ]; then
              echo "::error::frontend/dist contains only $COUNT file(s) — that is a stub, not the generated website."
              FAIL=1
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Netlify-native artifact verification failed. Not deploying. See the diagnostics step above."
            exit 1
          fi
          echo "Verified: Netlify-native build produced a usable frontend/dist."

      # ---------------------------------------------------------------------
      # DRAFT deploy. --no-build because the build already ran above.
      # No --prod: nadadebs.com is not touched.
      # ---------------------------------------------------------------------
      - name: Draft-deploy to Netlify
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
          DEPLOY_MESSAGE: 'Draft deploy (Netlify-native build) — GitHub Actions run ${{ github.run_id }} @ ${{ github.sha }}'
        run: |
          netlify deploy \
            --no-build \
            --context production \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$DEPLOY_MESSAGE" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Publish draft deploy URL to summary
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          [ -f "$LOG" ] || exit 0
          DRAFT_URL="$(grep -Eio 'https://[a-z0-9-]+--[a-z0-9._-]+\.netlify\.app' "$LOG" | head -n 1 || true)"
          {
            echo "### Netlify draft deploy (Netlify-native build)"
            echo ""
            if [ -n "$DRAFT_URL" ]; then
              echo "Draft URL: <$DRAFT_URL>"
            else
              echo "No draft URL found in the deploy output — check the deploy step logs."
            fi
            echo ""
            echo "_Production (nadadebs.com) was NOT modified by this run._"
          } >> "$GITHUB_STEP_SUMMARY"
