name: Deploy Nada Debs Production

# MANUAL PRODUCTION DEPLOY. This workflow publishes to nadadebs.com.
#
# It is deliberately workflow_dispatch-only: a human must click "Run workflow".
# Automatic deployment on push to main is NOT enabled yet, and will only be
# considered after this manual production deployment has been verified.
#
# The build is unchanged from the draft workflow that was proven working:
# `netlify build --context production` with NITRO_PRESET=netlify-static,
# followed by a --no-build deploy of the verified frontend/dist artifact.
#
# Findings that produced this configuration:
#   * Run 33059359770: Nitro auto-detected preset `static`, wrote the site to
#     frontend/.output/public, and left frontend/dist as a symlink. Only 1 file
#     was hashed, so the deploy served 404.
#   * Next run: setting NETLIFY=true did NOT switch the provider — Nitro still
#     resolved `static` and frontend/dist was still a symlink. The guard caught
#     it and refused to deploy. So provider auto-detection via the NETLIFY
#     environment variable does not work in this GitHub Actions environment,
#     and NETLIFY=true has been removed.
#
# Therefore the preset is set explicitly. nitropack 2.13.0 supports the
# NITRO_PRESET environment variable and ships the `netlify-static` preset,
# which is the correct variant for `nuxt generate` (statically generated site)
# and which sets the Nitro publicDir to `dist` — matching the Netlify project's
# configured publish directory of frontend/dist. This was verified working:
# preset resolved to netlify-static, frontend/dist was a real directory with
# 1660 files, and .output/public was never created.
#
# NETLIFY=true is deliberately NOT set alongside it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nada-debs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, then deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Provides NETLIFY_AUTH_TOKEN (secret) and NETLIFY_SITE_ID (variable).
    environment: nada-debs-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 matches the NODE_VERSION Netlify production pins. The runner's
      # "Node 20 actions are deprecated" warning refers to the JavaScript
      # runtime used by actions/checkout and actions/setup-node themselves, not
      # to the Node version used to build the site, and is unrelated to the
      # Nitro preset failure. It is deliberately not changed here.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Netlify site ID is configured
        env:
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::NETLIFY_SITE_ID is not set in the nada-debs-prod environment."
            exit 1
          fi
          echo "NETLIFY_SITE_ID is present."

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Netlify CLI
        run: npm install --global netlify-cli@27.4.0

      # ---------------------------------------------------------------------
      # BUILD ONLY, with the Nitro preset forced explicitly.
      # NOTE: NETLIFY=true is intentionally absent — see header comment.
      # ---------------------------------------------------------------------
      - name: Netlify build (production context, NITRO_PRESET=netlify-static)
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
          # The single mechanism under test in this run.
          NITRO_PRESET: netlify-static
        run: |
          echo "NITRO_PRESET is set to: '$NITRO_PRESET'"
          netlify build --context production 2>&1 | tee "$RUNNER_TEMP/build.log"

      # ---------------------------------------------------------------------
      # DIAGNOSTICS. No environment variable VALUES are printed except the
      # non-secret preset markers.
      # ---------------------------------------------------------------------
      - name: Diagnose build output
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"

          echo "=============================================================="
          echo "Resolved Nitro preset"
          echo "=============================================================="
          if [ -f "$LOG" ]; then
            sed 's/\x1b\[[0-9;]*m//g' "$LOG" | grep -iE "Nitro preset:" || echo "(no 'Nitro preset:' line found)"
          else
            echo "(build log missing)"
          fi

          echo
          echo "=== Preset-related environment markers ==="
          echo "NITRO_PRESET = '${NITRO_PRESET:-<unset>}'   (expected: netlify-static)"
          echo "NETLIFY      = '${NETLIFY:-<unset>}'        (expected: <unset> for this test)"
          echo "CONTEXT      = '${CONTEXT:-<unset>}'"
          echo "node         = $(node -v)"

          echo
          echo "=== nitro.json (wherever the preset placed it) ==="
          find frontend -maxdepth 4 -name nitro.json -not -path "*/node_modules/*" 2>/dev/null | while read -r nj; do
            echo "--- $nj ---"
            cat "$nj"
            echo
          done

          echo
          echo "=============================================================="
          echo "frontend/dist  (the configured publish directory)"
          echo "=============================================================="
          ls -ld frontend/dist 2>/dev/null || echo "frontend/dist DOES NOT EXIST"
          if [ -L frontend/dist ]; then
            echo "!! frontend/dist IS A SYMLINK -> $(readlink -f frontend/dist)"
          else
            echo "frontend/dist is NOT a symlink"
          fi
          echo "--- top level ---"
          ls -la frontend/dist 2>/dev/null || true
          echo "--- regular file count ---"
          echo "count: $(find frontend/dist -type f 2>/dev/null | wc -l)"
          echo "--- sample of files (first 60, maxdepth 3) ---"
          find frontend/dist -maxdepth 3 -type f 2>/dev/null | sort | head -60 || true

          echo
          echo "--- expected site entrypoints ---"
          for f in index.html 200.html 404.html; do
            if [ -f "frontend/dist/$f" ]; then echo "  present: $f"; else echo "  absent : $f"; fi
          done
          if [ -d frontend/dist/_nuxt ]; then
            echo "  present: _nuxt/ ($(find frontend/dist/_nuxt -type f | wc -l) files)"
          else
            echo "  absent : _nuxt/"
          fi

          echo
          echo "--- Netlify-specific generated artifacts (reported, not enforced) ---"
          for f in _redirects _headers; do
            if [ -f "frontend/dist/$f" ]; then
              echo "  present: $f"
              echo "  ----- $f (first 40 lines) -----"
              head -40 "frontend/dist/$f"
            else
              echo "  absent : $f"
            fi
          done

          echo
          echo "=============================================================="
          echo "frontend/.output/public  (reported only — NOT the deploy source)"
          echo "=============================================================="
          if [ -e frontend/.output/public ]; then
            ls -ld frontend/.output/public
            echo "regular file count: $(find frontend/.output/public -type f 2>/dev/null | wc -l)"
            if [ -f frontend/.output/public/index.html ]; then
              echo "frontend/.output/public/index.html EXISTS"
            else
              echo "frontend/.output/public/index.html MISSING"
            fi
          else
            echo "frontend/.output/public DOES NOT EXIST"
          fi

          echo
          echo "=== .netlify directory produced by the build, if any ==="
          ls -la frontend/.netlify 2>/dev/null || echo "(no frontend/.netlify)"

      # ---------------------------------------------------------------------
      # GUARD. Runs BEFORE any deploy.
      # There is deliberately NO fallback: nothing copies .output/public into
      # dist and nothing replaces a symlink. If netlify-static does not natively
      # produce the correct artifact, this fails and reports.
      # ---------------------------------------------------------------------
      - name: Verify netlify-static artifact before deploying
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          EXPECTED_PRESET="netlify-static"
          FAIL=0

          # Primary source: the build log line printed by Nuxt.
          PRESET=""
          if [ -f "$LOG" ]; then
            PRESET="$(sed 's/\x1b\[[0-9;]*m//g' "$LOG" \
              | grep -oiE "Nitro preset:[[:space:]]*[A-Za-z0-9._-]+" \
              | head -n 1 \
              | sed -E 's/.*:[[:space:]]*//')"
          fi

          # Secondary source: the preset recorded in nitro.json.
          if [ -z "$PRESET" ]; then
            for nj in $(find frontend -maxdepth 4 -name nitro.json -not -path "*/node_modules/*" 2>/dev/null); do
              PRESET="$(grep -o '"preset"[[:space:]]*:[[:space:]]*"[^"]*"' "$nj" \
                | head -n 1 | sed -E 's/.*"([^"]*)"$/\1/')"
              [ -n "$PRESET" ] && break
            done
          fi

          echo "Expected Nitro preset: '$EXPECTED_PRESET'"
          echo "Detected Nitro preset: '${PRESET:-<undetermined>}'"

          # CRITICAL 1: preset must be exactly netlify-static.
          if [ -z "$PRESET" ]; then
            echo "::error::Could not determine the resolved Nitro preset from the build log or nitro.json. Refusing to deploy unverified output."
            FAIL=1
          elif [ "$PRESET" != "$EXPECTED_PRESET" ]; then
            echo "::error::Nitro resolved preset '$PRESET', expected '$EXPECTED_PRESET'. NITRO_PRESET did not take effect as intended."
            FAIL=1
          else
            echo "OK: preset is exactly '$EXPECTED_PRESET'."
          fi

          # CRITICAL 2: frontend/dist must exist.
          if [ ! -e frontend/dist ]; then
            echo "::error::frontend/dist does not exist after the Netlify build."
            FAIL=1
          # CRITICAL 3: frontend/dist must be a real directory, not a symlink.
          elif [ -L frontend/dist ]; then
            echo "::error::frontend/dist is a symlink (-> $(readlink -f frontend/dist)), not a native directory. The deploy walker would upload nothing."
            FAIL=1
          elif [ ! -d frontend/dist ]; then
            echo "::error::frontend/dist exists but is not a directory."
            FAIL=1
          else
            echo "OK: frontend/dist is a real directory and not a symlink."

            # CRITICAL 4: index.html must exist.
            if [ ! -f frontend/dist/index.html ]; then
              echo "::error::frontend/dist/index.html is missing after the Netlify build."
              FAIL=1
            else
              echo "OK: frontend/dist/index.html exists."
            fi

            # CRITICAL 5: realistic file count (the broken artifact had 1).
            COUNT="$(find frontend/dist -type f | wc -l)"
            echo "frontend/dist regular file count: $COUNT"
            if [ "$COUNT" -le 10 ]; then
              echo "::error::frontend/dist contains only $COUNT file(s) — that is a stub, not a generated website."
              FAIL=1
            else
              echo "OK: frontend/dist contains $COUNT files."
            fi
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::netlify-static artifact verification FAILED. Not deploying. No fallback will be attempted — see the diagnostics step above."
            exit 1
          fi
          echo "All critical checks passed. Proceeding to production deploy."

      # ---------------------------------------------------------------------
      # PRODUCTION deploy. This publishes to nadadebs.com.
      #
      # --no-build because the build already ran above and its artifact has
      # been verified by the guard.
      #
      # --prod publishes the deploy to the site's production URL.
      #
      # Deliberately NO --context here: the CLI rejects it with
      #   "--context flag is only available when using the --build flag"
      # because --context selects the environment-variable context for a build,
      # and this step performs no build. The production context was already
      # applied by `netlify build --context production` above, so the artifact
      # being uploaded is already the production-context build. Do not re-add.
      # ---------------------------------------------------------------------
      - name: Deploy to Netlify production
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NETLIFY_CLI_TELEMETRY_DISABLED: '1'
          DEPLOY_MESSAGE: 'Production deploy — GitHub Actions run ${{ github.run_id }} @ ${{ github.sha }}'
        run: |
          netlify deploy \
            --no-build \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "$DEPLOY_MESSAGE" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      # Reports the production deployment result. This step is informational
      # only: it never fails the job, and it never masks a deploy failure —
      # the deploy step above fails on its own (shell: bash sets -o pipefail,
      # so a non-zero netlify exit code survives the `tee` pipe).
      #
      # Netlify labels its output URLs differently depending on the deploy
      # type, so several known labels are tried and whatever is present is
      # reported. A missing informational label is not treated as an error.
      - name: Publish production deploy result to summary
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          if [ ! -f "$LOG" ]; then
            {
              echo "### Netlify production deploy"
              echo ""
              echo "The deploy step produced no output log — it likely failed before running."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          CLEAN="$RUNNER_TEMP/deploy.clean.log"
          sed 's/\x1b\[[0-9;]*m//g' "$LOG" > "$CLEAN" 2>/dev/null || cp "$LOG" "$CLEAN"

          # Pull the first https:// URL from a line beginning with the label.
          # Angle brackets are stripped: the CLI prints "Label: <https://...>".
          url_for_label() {
            grep -iE "^[[:space:]]*$1:" "$CLEAN" 2>/dev/null \
              | head -n 1 \
              | grep -oE 'https://[^[:space:]<>]+' 2>/dev/null \
              | head -n 1 || true
          }

          WEBSITE_URL="$(url_for_label 'Website URL')"
          UNIQUE_URL="$(url_for_label 'Unique Deploy URL')"
          DEPLOY_URL="$(url_for_label 'Deploy URL')"
          LOGS_URL="$(url_for_label 'Build logs')"
          # Last-resort fallback so something useful is always reported.
          ANY_URL="$(grep -oE 'https://[a-z0-9._-]+\.netlify\.app[^[:space:]<>]*' "$CLEAN" 2>/dev/null | head -n 1 || true)"

          {
            echo "### Netlify production deploy"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo ""
            FOUND=0
            if [ -n "$WEBSITE_URL" ]; then echo "- **Website URL:** <$WEBSITE_URL>"; FOUND=1; fi
            if [ -n "$UNIQUE_URL" ]; then echo "- Unique deploy URL: <$UNIQUE_URL>"; FOUND=1; fi
            if [ -n "$DEPLOY_URL" ] && [ "$DEPLOY_URL" != "$UNIQUE_URL" ]; then echo "- Deploy URL: <$DEPLOY_URL>"; FOUND=1; fi
            if [ "$FOUND" -eq 0 ] && [ -n "$ANY_URL" ]; then echo "- Deployed URL: <$ANY_URL>"; FOUND=1; fi
            if [ "$FOUND" -eq 0 ]; then
              echo "- No deployment URL label was found in the CLI output. Check the deploy step logs; this alone does not mean the deploy failed."
            fi
            if [ -n "$LOGS_URL" ]; then echo "- Netlify deploy logs: <$LOGS_URL>"; fi
            echo ""
            echo "_This run published to the production Netlify site._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
